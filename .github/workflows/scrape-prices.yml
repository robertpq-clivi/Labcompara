name: Scrape prices

# Cada 7 días. Domingo 13:00 UTC ≈ 07:00 America/Mexico_City.
# Se usa "domingo" y no "*/7" porque */7 se desalinea al cambiar de mes
# (dispararía días 1, 8, 15, 22, 29 y luego otra vez el 1).
on:
  schedule:
    - cron: "0 13 * * 0"
  workflow_dispatch:
    inputs:
      vertical:
        description: "Qué escanear"
        type: choice
        options: ["todas", "laboratorio", "medicamentos", "medicinas"]
        default: "todas"
      dry_run:
        description: "Escanear y reportar sin commitear"
        type: boolean
        default: false
      volcar:
        description: "Guardar el HTML crudo de cada fuente como artifact"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tests
        run: npm test

      # Las tres verticales corren en pasos separados para que una caída de un
      # laboratorio no impida refrescar los medicamentos, ni al revés. En la
      # corrida por cron `inputs.vertical` viene vacío: por eso cada condición
      # lista los casos en vez de negar uno solo.
      - name: Escanear laboratorios
        if: ${{ inputs.vertical == '' || inputs.vertical == 'todas' || inputs.vertical == 'laboratorio' }}
        run: node scripts/scan-labs.js --apply
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPER_PROVIDER: zyte

      - name: Escanear medicamentos GLP-1
        if: ${{ inputs.vertical == '' || inputs.vertical == 'todas' || inputs.vertical == 'medicamentos' }}
        continue-on-error: true
        run: node scripts/scan-farmacias.js ${{ inputs.volcar && '--volcar' || '' }}
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPER_PROVIDER: zyte

      # 100 principios activos × 5 farmacias con pausa de cortesía: es el paso
      # más largo de los tres, por eso va al final.
      - name: Escanear medicinas de farmacia
        if: ${{ inputs.vertical == '' || inputs.vertical == 'todas' || inputs.vertical == 'medicinas' }}
        continue-on-error: true
        run: node scripts/scan-medicinas.js
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPER_PROVIDER: zyte

      - name: Verificar el feed y el snapshot embebido
        run: node scripts/test-feed.js

      # Las comparativas entre laboratorios citan precios en el HTML. Si no se
      # regeneran aquí, quedan afirmando lo que los precios decían la semana
      # pasada — que fue justo como llegaron a recomendar el lab equivocado.
      - name: Regenerar comparativas de laboratorios
        run: node scripts/generar-comparativas.js --apply

      # Lo mismo para los artículos de precio por medicamento: citan precios,
      # tabla por farmacia y el mes en el <title>. Sin este paso quedarían
      # anunciando "agosto" con los precios de agosto en pleno noviembre.
      - name: Regenerar artículos de precio por medicamento
        run: node scripts/generar-blog-medicinas.js --apply

      # Las páginas de precio por estudio se habían escrito a mano y se
      # quedaron dos años atrás de los precios reales. Ahora salen del scan,
      # así que tienen que regenerarse con él o vuelven al mismo lugar.
      - name: Regenerar artículos de precio por estudio
        run: node scripts/generar-blog-estudios.js --apply

      - name: Regenerar artículos de precio de GLP-1
        run: node scripts/generar-blog-glp1.js --apply

      # Los sitemaps se venían commiteando sin regenerarse nunca: el paso de
      # commit incluía sitemap-blog.xml, pero ningún paso lo escribía. Mientras
      # los generadores sólo sobrescriben páginas que ya existen no se nota; el
      # día que una entrada nueva de un copy JSON cree un post nuevo, ese post
      # no entraría al sitemap y Google no se enteraría de él.
      - name: Regenerar sitemaps
        run: node scripts/generate-sitemaps.js

      - name: Resumen de la corrida
        if: always()
        run: |
          {
            echo "## Scan de precios"
            echo
            if [ -f data/reporte.md ]; then
              echo "### Laboratorio"; echo
              sed -n '1,30p' data/reporte.md
            fi
            if [ -f data/medicamentos/reporte.md ]; then
              echo; echo "### Medicamentos GLP-1"; echo
              cat data/medicamentos/reporte.md
            fi
            if [ -f data/medicinas/reporte.md ]; then
              echo; echo "### Medicinas de farmacia"; echo
              sed -n '1,40p' data/medicinas/reporte.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commitear precios actualizados
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "medcompara-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ pages/laboratorio.html blog/*-vs-*-precios.html blog/precio-*-mexico.html blog/precio-*-cdmx.html blog/cuanto-cuesta-check-up-mexico.html blog/laboratorio-mas-barato-cdmx.html blog/estudios-laboratorio-precios-mexico.html blog/index.html blog/ozempic-precio-mexico.html blog/mounjaro-precio-mexico.html blog/wegovy-precio-mexico.html blog/cuanto-cuesta-bajar-de-peso-con-glp1-mexico.html sitemap-blog.xml sitemap-core.xml sitemap-index.xml
          if git diff --staged --quiet; then
            echo "Sin cambios de precio."
          else
            git commit -m "chore(data): refrescar precios [skip ci]"
            # El scan tarda más de una hora: es normal que alguien haya
            # empujado a main mientras corría, y entonces este push se
            # rechaza y se pierde una corrida entera de datos ya obtenidos.
            #
            # El rebase por sí solo no basta y ya costó una corrida: si
            # alguien tocó a mano un archivo que este paso también escribe
            # —data/medicinas/prices.json, por ejemplo— el rebase entra en
            # conflicto y los tres intentos fallan igual.
            #
            # Para datos GENERADOS no hay conflicto real que resolver: lo que
            # acaba de salir del scan es la verdad. Así que se guarda aparte,
            # se toma la punta de main y se vuelve a poner encima.
            for intento in 1 2 3; do
              git push && exit 0
              echo "push rechazado (intento $intento): reacomodando sobre main"
              rm -rf /tmp/recien-escaneado && mkdir -p /tmp/recien-escaneado
              git diff --name-only HEAD~1 HEAD | while read -r f; do
                mkdir -p "/tmp/recien-escaneado/$(dirname "$f")"
                cp "$f" "/tmp/recien-escaneado/$f" 2>/dev/null || true
              done
              git fetch origin main && git reset --hard origin/main
              cp -a /tmp/recien-escaneado/. "$GITHUB_WORKSPACE/"
              git add -A
              git diff --staged --quiet || git commit -m "chore(data): refrescar precios [skip ci]"
              sleep 5
            done
            echo "::error::no se pudo empujar los precios después de 3 intentos"
            exit 1
          fi

      - name: Subir los catálogos crudos como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogos-crudos
          path: |
            data/scan/
            data/medicamentos/crudo.json
            data/medicamentos/debug/
            data/medicinas/crudo.json
          retention-days: 30
          if-no-files-found: ignore
